name: Publish ClawHub Plugin

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zeroapi-publish-clawhub-plugin
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # Generous bound: the downstream install smoke test retries up to 10x at 300s
    # each (~52min worst case), so a lower cap would false-fail a slow-but-valid
    # publish. It still stops a genuinely wedged job well under the 6h default.
    timeout-minutes: 60
    env:
      CLAWHUB_CLI_VERSION: "0.12.2"
      NPM_CONFIG_IGNORE_SCRIPTS: "true"
      NO_COLOR: "1"
      # Intentionally "latest": this is a post-publish smoke test whose job is to
      # confirm the freshly published plugin installs under the OpenClaw users
      # actually have now. Pinning would let it pass against a stale binary while
      # real installs break.
      OPENCLAW_VERIFY_VERSION: "latest"
    steps:
      - name: Set private ClawHub config path
        run: printf 'CLAWHUB_CONFIG_PATH=%s/zeroapi-clawhub-auth/config.json\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Install release tooling
        run: npm ci --ignore-scripts

      - name: Read package version
        id: version
        run: |
          VERSION="$(node -p "require('./plugin/package.json').version")"
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Stage runtime plugin package
        run: node scripts/stage_clawhub_plugin.mjs .tmp-clawhub-plugin

      - name: Prepare private ClawHub authentication
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const token = process.env.CLAWHUB_TOKEN;
          if (!token) throw new Error("CLAWHUB_TOKEN secret is required");
          const target = process.env.CLAWHUB_CONFIG_PATH;
          // ClawHub v0.12.2's documented config override and native config schema.
          // The credential exists only in this private runner-local CLI store.
          fs.mkdirSync(path.dirname(target), { mode: 0o700 });
          fs.writeFileSync(target, JSON.stringify({ registry: "https://clawhub.ai", token }),
            { mode: 0o600, flag: "wx" });
          NODE

      - name: Verify ClawHub publisher identity
        run: |
          identity="$(npx --yes "clawhub@$CLAWHUB_CLI_VERSION" whoami 2>&1)" || {
            echo "::error::ClawHub authentication failed."
            exit 1
          }
          if [[ ! "$identity" =~ (^|$'\n')[^[:alnum:]@]*@?dorukardahan($|$'\r'|$'\n') ]]; then
            echo "::error::ClawHub publisher does not match the expected package owner."
            exit 1
          fi

      - name: Publish plugin package
        run: |
          set +e
          npx --yes "clawhub@$CLAWHUB_CLI_VERSION" package publish .tmp-clawhub-plugin \
            --family code-plugin \
            --name zeroapi \
            --display-name "ZeroAPI Router" \
            --version "${{ steps.version.outputs.value }}" \
            --changelog "Publish ZeroAPI ${{ steps.version.outputs.value }}" \
            --source-repo dorukardahan/ZeroAPI \
            --source-commit "$GITHUB_SHA" \
            --source-ref "$GITHUB_REF_NAME" \
            --source-path "plugin" 2>&1 | tee .tmp-clawhub-publish.log
          status="${PIPESTATUS[0]}"
          set -e
          if [ "$status" -ne 0 ]; then
            if grep -Eiq 'already exists|version .* exists|duplicate' .tmp-clawhub-publish.log; then
              echo "ClawHub package version already exists; continuing to verification."
            else
              exit "$status"
            fi
          fi

      - name: Verify ClawHub package metadata
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.value }}
        run: |
          # Community release scans are asynchronous. Wait at most five minutes
          # for the exact release's public trust result and package latest.
          node scripts/verify_clawhub_release.mjs "$EXPECTED_VERSION"

      - name: Verify ClawHub package is downloadable
        run: |
          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "$tmp_dir"' EXIT
          cd "$tmp_dir"
          export OPENCLAW_STATE_DIR="$tmp_dir/openclaw-state"
          export OPENCLAW_CONFIG_PATH="$OPENCLAW_STATE_DIR/openclaw.json"
          # Consent applies to this reviewed, exact, scan-clean package. Native
          # policy and unsafe-install gates remain enabled.
          for attempt in $(seq 1 10); do
            if timeout 300s env npm_config_yes=true npx --yes "openclaw@$OPENCLAW_VERIFY_VERSION" plugins install "clawhub:zeroapi@${{ steps.version.outputs.value }}" --accept-capabilities; then
              exit 0
            fi
            if [ "$attempt" -eq 10 ]; then
              echo "OpenClaw could not install the ClawHub package after retries."
              exit 1
            fi
            echo "OpenClaw install smoke test failed; retrying in 15s ($attempt/10)."
            sleep 15
          done

      - name: Remove temporary ClawHub authentication
        if: always()
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const target = process.env.CLAWHUB_CONFIG_PATH;
          fs.rmSync(target, { force: true });
          try { fs.rmdirSync(path.dirname(target)); }
          catch (error) { if (error.code !== "ENOENT") throw error; }
          NODE
