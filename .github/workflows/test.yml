name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  NPM_CONFIG_IGNORE_SCRIPTS: 'true'
  OPENCLAW_MAIN_SHA: '6223cf8b74800e22b85f16c71cfd002965d426e0'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      # First-party actions pinned to immutable commit SHAs (a moved/compromised
      # major tag could run unreviewed code on jobs holding GITHUB_TOKEN). The
      # github-actions Dependabot config (.github/dependabot.yml) bumps these.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r integrations/hermes/requirements-test.txt
      - run: npm ci
      - run: npm run audit:ci
      - run: npm test

  openclaw-compat:
    name: openclaw-compat (${{ matrix.label }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # Minimum JSON fallback and the installed/current SQLite public SDK.
          - version: '2026.5.2'
            integrity: 'sha512-Jz00jdV/yE0/RfAln0tVlEq1hX9DIZdc7NRZVQRpt98XINduqoua9uOc1Ty4GeYlg5c746Lhl5ZCe6A4rsOmng=='
            label: minimum-json
            layout: json
            dispatch: callback
            fixture: legacy
            typecheck: false
            source: false
            node: '22'
          - version: '2026.9.1'
            integrity: 'sha512-0Ve0631CdgkJDwd4NNG1BawIdF5yCL2sO+Tts8amStw+H6vKURTj0K4rOa4+hFpJk1Dnw5LyKl5twzwX1VtA2w=='
            label: stable-sqlite-and-main-hooks
            layout: sqlite
            dispatch: native
            fixture: current
            typecheck: true
            source: true
            node: '22'
          - version: '2026.9.3'
            integrity: 'sha512-CzDHMeHdnjlIZ76ZyBb1lvLO4H/yBIMYXupFGGBN87x0853y3hg5nLAnKfxSKqLzqhbUKqy9ebDRAWWV4t8aew=='
            label: release-2026.9.3
            layout: sqlite
            dispatch: native
            fixture: current
            typecheck: true
            source: false
            node: '24'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - name: Install exact OpenClaw package
        run: |
          actual_integrity="$(npm view "openclaw@${{ matrix.version }}" dist.integrity)"
          test "$actual_integrity" = "${{ matrix.integrity }}"
          npm install --no-save --package-lock=false "openclaw@${{ matrix.version }}"
      - name: Typecheck adapter and public SDK contract witness
        if: matrix.typecheck
        run: npx tsc --project tsconfig.openclaw-compat.json
      - name: Stage ClawHub plugin artifact
        run: node scripts/stage_clawhub_plugin.mjs /tmp/zeroapi-staged
      - name: Prepare isolated OpenClaw state
        run: |
          mkdir -p /tmp/zeroapi-staged/node_modules /tmp/zeroapi-openclaw-state
          ln -s "$GITHUB_WORKSPACE/node_modules/openclaw" /tmp/zeroapi-staged/node_modules/openclaw
          fixture_dir="openclaw"
          if [ "${{ matrix.fixture }}" = current ]; then fixture_dir="openclaw-current"; fi
          cp "scripts/__fixtures__/$fixture_dir/zeroapi-config.json" /tmp/zeroapi-openclaw-state/zeroapi-config.json
          node -e 'require("node:fs").writeFileSync("/tmp/zeroapi-openclaw-state/openclaw.json", JSON.stringify({plugins:{allow:["zeroapi-router"],load:{paths:["/tmp/zeroapi-staged"]},entries:{"zeroapi-router":{enabled:true,hooks:{allowConversationAccess:true}}}}}, null, 2) + "\n")'
      - name: Runtime inspect exact OpenClaw host
        run: |
          expected_version="$(node -p 'require("./plugin/package.json").version')"
          OPENCLAW_STATE_DIR=/tmp/zeroapi-openclaw-state \
          OPENCLAW_CONFIG_PATH=/tmp/zeroapi-openclaw-state/openclaw.json \
          node node_modules/openclaw/openclaw.mjs plugins inspect zeroapi-router --runtime --json \
            > /tmp/zeroapi-openclaw-inspect.json
          jq -e --arg version "$expected_version" \
            '(.plugin.id == "zeroapi-router") and (.plugin.status == "loaded") and (.plugin.version == $version) and (.plugin.imported == true) and (.plugin.activated == true) and (.diagnostics | length == 0)' \
            /tmp/zeroapi-openclaw-inspect.json
      - name: Exercise typed hooks against exact OpenClaw SDK
        run: |
          OPENCLAW_STATE_DIR=/tmp/zeroapi-openclaw-state \
          OPENCLAW_CONFIG_PATH=/tmp/zeroapi-openclaw-state/openclaw.json \
          node scripts/openclaw_compat_smoke.mjs /tmp/zeroapi-staged "${{ matrix.layout }}" "${{ matrix.dispatch }}" "${{ matrix.fixture }}"

      - name: Fetch reviewed current OpenClaw source
        if: matrix.source
        run: |
          git init /tmp/openclaw-main
          git -C /tmp/openclaw-main remote add origin https://github.com/openclaw/openclaw.git
          git -C /tmp/openclaw-main fetch --depth 1 origin "$OPENCLAW_MAIN_SHA"
          git -C /tmp/openclaw-main checkout --detach FETCH_HEAD
          test "$(git -C /tmp/openclaw-main rev-parse HEAD)" = "$OPENCLAW_MAIN_SHA"
      - name: Exercise the exact current-main native hook runner
        if: matrix.source
        run: |
          node scripts/openclaw_source_hooks.mjs /tmp/openclaw-main "$OPENCLAW_MAIN_SHA" \
            "$GITHUB_WORKSPACE/node_modules/openclaw" /tmp/openclaw-main-hooks
          node scripts/openclaw_compat_smoke.mjs /tmp/zeroapi-staged sqlite source current \
            /tmp/openclaw-main-hooks/hooks.mjs

  hermes-compat:
    name: hermes-compat (${{ matrix.label }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: prior-supported-stable
            sha: '3c27eb6234bf91b8ceee9e9071591b31e9b148cb'
            native: false
          - label: current-main
            sha: '693641aa8b4359c602283bdbbc14041e03bc47bc'
            native: true
          - label: release-2026.9.7
            sha: '2237be355906fbe6065ce1815711eee52b2d646e'
            native: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r integrations/hermes/requirements-test.txt
      - name: Fetch exact Hermes source
        run: |
          git init /tmp/hermes-exact
          git -C /tmp/hermes-exact remote add origin https://github.com/NousResearch/hermes-agent.git
          git -C /tmp/hermes-exact fetch --depth 1 origin "${{ matrix.sha }}"
          git -C /tmp/hermes-exact checkout --detach FETCH_HEAD
          test "$(git -C /tmp/hermes-exact rev-parse HEAD)" = "${{ matrix.sha }}"
      - name: Prepare isolated Hermes plugin profile
        run: |
          mkdir -p /tmp/hermes-home/plugins
          cp -R integrations/hermes /tmp/hermes-home/plugins/zeroapi-router
          python -c 'from pathlib import Path; Path("/tmp/hermes-home/config.yaml").write_text("plugins:\n  enabled:\n    - zeroapi-router\n", encoding="utf-8")'
      - name: Patch exact Hermes runtime transactionally and prove idempotency
        run: |
          PATCH_ARGS=(
            --plugins /tmp/hermes-exact/hermes_cli/plugins.py
            --run-agent /tmp/hermes-exact/run_agent.py
            --conversation-loop /tmp/hermes-exact/agent/conversation_loop.py
            --turn-context /tmp/hermes-exact/agent/turn_context.py
            --delegate-tool /tmp/hermes-exact/tools/delegate_tool.py
            --backup-root /tmp/hermes-home/backups/zeroapi-router
            --plugin-discovery-root /tmp/hermes-home/plugins
          )
          python integrations/hermes/patch_runtime.py "${PATCH_ARGS[@]}" --dry-run
          python integrations/hermes/patch_runtime.py "${PATCH_ARGS[@]}"
          second_output="$(python integrations/hermes/patch_runtime.py "${PATCH_ARGS[@]}")"
          printf '%s\n' "$second_output"
          grep -F 'already has the ZeroAPI runtime compatibility patch' <<<"$second_output"
      - name: Run ZeroAPI doctor against exact patched Hermes source
        env:
          HERMES_HOME: /tmp/hermes-home
          ZEROAPI_CONFIG_PATH: ${{ github.workspace }}/scripts/__fixtures__/openclaw/zeroapi-config.json
        run: |
          python /tmp/hermes-home/plugins/zeroapi-router/doctor.py \
            --hermes-root /tmp/hermes-exact \
            --plugin-root /tmp/hermes-home/plugins/zeroapi-router \
            --plugin-discovery-root /tmp/hermes-home/plugins \
            --config /tmp/hermes-home/config.yaml
      - name: Exercise raw-main transaction recovery against exact Git objects
        if: matrix.native
        env:
          ZEROAPI_HERMES_GIT_ROOT: /tmp/hermes-exact
          ZEROAPI_HERMES_TEST_REF: ${{ matrix.sha }}
        run: python -m unittest discover -s integrations/hermes -p 'test_upstream_source.py'
      - name: Check installed plugin against the native import-removal gate
        if: matrix.native
        env:
          ZEROAPI_HERMES_COMPAT_ROOT: /tmp/hermes-exact
        run: python -m unittest discover -s integrations/hermes -p 'test_host_plugin_compat.py'
      - name: Install exact source runtime and test dependencies from its lock
        if: matrix.native
        run: |
          python -m pip install uv==0.12.1
          uv sync --directory /tmp/hermes-exact --locked --extra dev --python 3.11
      - name: Exercise native AIAgent routing and delegation offline
        if: matrix.native
        run: |
          /tmp/hermes-exact/.venv/bin/python -I -B integrations/hermes/native_smoke.py \
            --hermes-root /tmp/hermes-exact
